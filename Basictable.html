<!DOCTYPE html>
<html>
    <head>
    <title>Basic HTML table</title>
    </head>
    <body>
        <h2>Employee Information Table</h2>
        <table border="10"
            <tr><!--TABLE ROW-->
                <th>First name</th> <!--TABLE HEADER-->
                <th>Age</th>
                <th>Department</th>
            </tr>
            <tr> <!--TABLE DESCRIPTION-->
                <TD>Lucas</TD>
                <td>24</td>
                <td>Cricket</td>
            </tr>
            <tr>
                <td>Pessi</td>
                <td>39</td>
                <td>Football</td>
            </tr>
        </table>
        </body>
</html>
