<html>
    <head>
        <title>Accessibility Styling</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                line-height: 1.5;
            }
            /*Button styling*/
            button {
                padding: 10px 20px;
                background:darkblue;
                color: white;
                border: none; 
            }
            /*Focus outline for keyboards users*/
            button:focus {
                outline: 3px solid 
                yellow;
                outline-offset: 4px;
            }
            /*High contrast text box*/
            .box{
                margin-top:20px
            }

        </style>
    </head>
   
    </body>
</html>
