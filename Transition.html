<!--CSS transiton example-->
<html><head>
    <style>
        .table {
            width:120px;
            height:120px;
            background-color: lightblue;
            /*transition properties*/
            transition-property: background-color; /* what to animate*/
            transition-duration: 2s;    /*how long*/
        }
        .table:hover {
            background-color: lightcoral;
        }
    </style>
</head>
<body>
    <div class="table">Hover me</div>
</body>
</html>
